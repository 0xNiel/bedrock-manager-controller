apiVersion: bedrock.aws.example.com/v1
kind: BedrockResource
metadata:
  name: custom-inference-profile
  namespace: default
spec:
  type: inferenceProfile
  region: us-east-1
  inferenceProfile:
    name: "CustomInferenceProfile"
    description: "Custom inference configuration for optimized performance and cost tracking"
    modelSource:
      # Copy from an existing foundation model or system-defined inference profile
      # Example foundation model ARN for Nova Micro
      copyFrom: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0"
    tags:
      Environment: "production"
      Team: "ai-platform"
      Purpose: "cost-tracking"
