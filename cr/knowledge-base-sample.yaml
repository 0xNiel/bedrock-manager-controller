apiVersion: bedrock.aws.example.com/v1
kind: BedrockResource
metadata:
  name: product-knowledge-base
  namespace: default
spec:
  type: knowledgeBase
  region: us-east-1
  knowledgeBase:
    name: "ProductKnowledgeBase"
    description: "Knowledge base containing product information and FAQs"
    # REPLACE ME: Knowledge Base execution role ARN (replace REPLACE_ME_AWS_ACCOUNT_ID with your AWS account ID)
    roleArn: "arn:aws:iam::REPLACE_ME_AWS_ACCOUNT_ID:role/AmazonBedrockExecutionRoleForKnowledgeBase_TestRole"
    embeddingModelArn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v1"
    vectorStoreType: "OPENSEARCH_SERVERLESS"
    opensearchServerlessConfiguration:
      # REPLACE ME: your OpenSearch Serverless collection ARN
      collectionArn: "arn:aws:aoss:us-east-1:REPLACE_ME_AWS_ACCOUNT_ID:collection/kb-collection"
      vectorIndexName: "vector-index"
      vectorField: "vector"
      textField: "text"
      metadataField: "metadata"
    tags:
      Environment: "test"
      Purpose: "product-knowledge"
      Team: "platform"
