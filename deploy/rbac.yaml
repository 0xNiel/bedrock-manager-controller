apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-controller
rules:
# Core permissions for BedrockResource CRD
- apiGroups: ["bedrock.aws.example.com"]
  resources: ["bedrockresources"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["bedrock.aws.example.com"]
  resources: ["bedrockresources/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["bedrock.aws.example.com"]
  resources: ["bedrockresources/finalizers"]
  verbs: ["update"]

# Core Kubernetes API permissions
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Coordination for leader election (future use)
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-controller
subjects:
- kind: ServiceAccount
  name: bedrock-controller
  namespace: bedrock-system
