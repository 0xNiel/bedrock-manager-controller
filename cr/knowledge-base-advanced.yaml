apiVersion: bedrock.aws.example.com/v1
kind: BedrockResource
metadata:
  name: advanced-knowledge-base
  namespace: default
spec:
  type: knowledgeBase
  region: us-east-1
  knowledgeBase:
    name: "AdvancedKnowledgeBase"
    description: "Advanced knowledge base with comprehensive configuration for enterprise documents"
    roleArn: "arn:aws:iam::REPLACE_ME_AWS_ACCOUNT_ID:role/AmazonBedrockExecutionRoleForKnowledgeBase_TestRole"
    embeddingModelArn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0"
    vectorStoreType: "OPENSEARCH_SERVERLESS"
    opensearchServerlessConfiguration:
      collectionArn: "arn:aws:aoss:us-east-1:REPLACE_ME_AWS_ACCOUNT_ID:collection/enterprise-kb-collection"
      vectorIndexName: "enterprise-vector-index"
      vectorField: "bedrock-knowledge-base-default-vector"
      textField: "AMAZON_BEDROCK_TEXT_CHUNK"
      metadataField: "AMAZON_BEDROCK_METADATA"
    tags:
      Environment: "production"
      Purpose: "enterprise-knowledge"
      Team: "platform"
      CostCenter: "engineering"
      DataClassification: "internal"
