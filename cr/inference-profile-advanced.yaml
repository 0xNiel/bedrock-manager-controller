apiVersion: bedrock.aws.example.com/v1
kind: BedrockResource
metadata:
  name: claude-cost-tracker
  namespace: default
spec:
  type: inferenceProfile
  region: us-east-1
  inferenceProfile:
    name: "ClaudeCostTracker"
    description: "Inference profile for tracking Claude model usage and costs across teams"
    modelSource:
      # Copy from Amazon Nova Micro foundation model
      copyFrom: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0"
    tags:
      Environment: "production"
      Team: "ml-engineering"
      Model: "nova-micro"
      Purpose: "cost-analysis"
      Department: "engineering"
