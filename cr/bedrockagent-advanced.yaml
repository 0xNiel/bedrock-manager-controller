apiVersion: bedrock.aws.example.com/v1
kind: BedrockResource
metadata:
  name: advanced-agent
  namespace: default
spec:
  type: agent
  region: us-east-1
  agent:
    name: "AdvancedCustomerAgent"
    description: "Advanced customer service agent with guardrails and memory"
    foundationModel: "amazon.nova-micro-v1:0"
    instruction: |
      You are an advanced customer service agent with access to customer data and order systems.
      Use the provided knowledge base and action groups to help customers effectively.
      Always maintain customer privacy and follow security protocols.
    # REPLACE ME: IAM role ARN the agent assumes (replace REPLACE_ME_AWS_ACCOUNT_ID with your AWS account ID)
    agentResourceRoleArn: "arn:aws:iam::REPLACE_ME_AWS_ACCOUNT_ID:role/AmazonBedrockExecutionRoleForAgents_TestRole"
    # REPLACE ME: your KMS key ARN (or remove this field to use an AWS-owned key)
    customerEncryptionKeyArn: "arn:aws:kms:us-east-1:REPLACE_ME_AWS_ACCOUNT_ID:key/REPLACE_ME_KMS_KEY_ID"
    autoPrepare: true
    idleSessionTTLInSeconds: 1800
    guardrailConfiguration:
      # REPLACE ME: ID and version of an existing Bedrock guardrail (or remove guardrailConfiguration)
      guardrailId: "REPLACE_ME_GUARDRAIL_ID"
      guardrailVersion: "1"
    memoryConfiguration:
      enabledMemoryTypes:
      - SESSION_SUMMARY
      storageDays: 30
    tags:
      Environment: "production"
      Team: "customer-service"
      Purpose: "advanced-support"
      Compliance: "required"
