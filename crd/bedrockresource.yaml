apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bedrockresources.bedrock.aws.example.com
spec:
  group: bedrock.aws.example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - agent
                - inferenceProfile
                - knowledgeBase
                description: "The type of Bedrock resource to manage"
              
              # Agent-specific configuration
              agent:
                type: object
                properties:
                  name:
                    type: string
                    description: "Name for the agent"
                  description:
                    type: string
                    description: "Description of the agent"
                  foundationModel:
                    type: string
                    description: "Foundation model ID for the agent"
                  instruction:
                    type: string
                    description: "Instructions that tell the agent what it should do"
                  agentResourceRoleArn:
                    type: string
                    description: "IAM role ARN with permissions to invoke API operations"
                  customerEncryptionKeyArn:
                    type: string
                    description: "KMS key ARN for encryption"
                  idleSessionTTLInSeconds:
                    type: integer
                    minimum: 60
                    maximum: 3600
                    description: "Session timeout in seconds"
                  autoPrepare:
                    type: boolean
                    default: false
                    description: "Automatically prepare the agent after creation/updates"
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: "AWS tags to apply to the agent"
                  
                  # Advanced configurations (optional)
                  guardrailConfiguration:
                    type: object
                    properties:
                      guardrailId:
                        type: string
                      guardrailVersion:
                        type: string
                    description: "Guardrail configuration for the agent"
                  
                  memoryConfiguration:
                    type: object
                    properties:
                      enabledMemoryTypes:
                        type: array
                        items:
                          type: string
                          enum:
                          - SESSION_SUMMARY
                      storageDays:
                        type: integer
                        minimum: 1
                        maximum: 999
                    description: "Memory configuration for the agent"
              
              # Inference Profile configuration
              inferenceProfile:
                type: object
                required:
                - name
                - modelSource
                properties:
                  name:
                    type: string
                    description: "Name for the inference profile"
                  description:
                    type: string
                    description: "Description of the inference profile"
                  modelSource:
                    type: object
                    required:
                    - copyFrom
                    properties:
                      copyFrom:
                        type: string
                        description: "ARN of the foundation model or system-defined inference profile to copy from"
                        pattern: "^arn:aws[a-z0-9-]*:bedrock:[a-z0-9-]*:[0-9]*:(foundation-model|inference-profile)/.+$"
                    description: "Model source configuration for the inference profile"
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: "AWS tags to apply to the inference profile"
                
              # Knowledge Base configuration
              knowledgeBase:
                type: object
                required:
                - name
                - roleArn
                - embeddingModelArn
                - vectorStoreType
                properties:
                  name:
                    type: string
                    description: "Name for the knowledge base"
                  description:
                    type: string
                    description: "Description of the knowledge base"
                  roleArn:
                    type: string
                    description: "IAM role ARN that the Knowledge Base uses to access other AWS services"
                  embeddingModelArn:
                    type: string
                    description: "ARN of the model used for generating embeddings"
                  vectorStoreType:
                    type: string
                    enum:
                    - OPENSEARCH_SERVERLESS
                    - PINECONE
                    - REDIS_ENTERPRISE_CLOUD
                    description: "Type of vector database to use"
                  opensearchServerlessConfiguration:
                    type: object
                    properties:
                      collectionArn:
                        type: string
                        description: "ARN of the OpenSearch Serverless collection"
                      vectorIndexName:
                        type: string
                        description: "Name of the vector index"
                      vectorField:
                        type: string
                        description: "Name of the field containing the vector"
                      textField:
                        type: string
                        description: "Name of the field containing the text content"
                      metadataField:
                        type: string
                        description: "Name of the field containing metadata"
                  dataSources:
                    type: array
                    description: "Data sources to be associated with this knowledge base"
                    items:
                      type: object
                      required:
                      - name
                      - dataSourceType
                      properties:
                        name:
                          type: string
                          description: "Name of the data source"
                        description:
                          type: string
                          description: "Description of the data source"
                        dataSourceType:
                          type: string
                          enum:
                          - S3
                          - WEB_CRAWLER
                          - CONFLUENCE
                          - SALESFORCE
                          - SHAREPOINT
                          description: "Type of data source"
                        s3Configuration:
                          type: object
                          properties:
                            bucketArn:
                              type: string
                              description: "ARN of the S3 bucket containing the data"
                            inclusionPrefixes:
                              type: array
                              items:
                                type: string
                              description: "S3 prefixes to include in the data source"
                            exclusionPrefixes:
                              type: array
                              items:
                                type: string
                              description: "S3 prefixes to exclude from the data source"
                            inclusionPatterns:
                              type: array
                              items:
                                type: string
                              description: "File patterns to include (e.g., '*.pdf', '*.txt')"
                            exclusionPatterns:
                              type: array
                              items:
                                type: string
                              description: "File patterns to exclude"
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: "AWS tags to apply to the knowledge base"
                
              # Common configuration
              region:
                type: string
                default: "us-east-1"
                description: "AWS region for the Bedrock resource"
                
            # Note: Validation for exactly one resource type is handled by the controller
              
          status:
            type: object
            properties:
              # Standard Kubernetes conditions
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - "Unknown"
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                  required:
                  - type
                  - status
                  - lastTransitionTime
                description: "Current status conditions"
                
              # Resource-specific status
              phase:
                type: string
                enum:
                - Creating
                - Created
                - Preparing
                - Prepared
                - Updating
                - Deleting
                - Failed
                description: "Current phase of the resource"
                
              # Agent-specific status
              agentId:
                type: string
                description: "AWS Agent ID when type is agent"
              agentArn:
                type: string
                description: "AWS Agent ARN when type is agent"
              agentStatus:
                type: string
                description: "AWS Agent status"
              agentVersion:
                type: string
                description: "AWS Agent version"
              preparedAt:
                type: string
                format: date-time
                description: "When the agent was last prepared"
                
              # Inference Profile-specific status
              inferenceProfileId:
                type: string
                description: "AWS Inference Profile ID when type is inferenceProfile"
              inferenceProfileArn:
                type: string
                description: "AWS Inference Profile ARN when type is inferenceProfile"
              inferenceProfileStatus:
                type: string
                description: "AWS Inference Profile status"
              inferenceProfileType:
                type: string
                description: "AWS Inference Profile type"
                
              # Knowledge Base status fields
              knowledgeBaseId:
                type: string
                description: "AWS Knowledge Base ID when type is knowledgeBase"
              knowledgeBaseArn:
                type: string
                description: "AWS Knowledge Base ARN when type is knowledgeBase"
              knowledgeBaseStatus:
                type: string
                description: "AWS Knowledge Base status"
              dataSourceIds:
                type: array
                items:
                  type: string
                description: "IDs of associated data sources"
              dataSources:
                type: array
                description: "Detailed information about data sources"
                items:
                  type: object
                  required:
                  - name
                  - dataSourceId
                  - status
                  properties:
                    name:
                      type: string
                      description: "Name of the data source"
                    dataSourceId:
                      type: string
                      description: "AWS data source ID"
                    status:
                      type: string
                      description: "Current status of the data source"
                    lastIngestionJobId:
                      type: string
                      description: "ID of the most recent ingestion job"
                    lastIngestionJobStatus:
                      type: string
                      description: "Status of the most recent ingestion job"
                    failureReasons:
                      type: array
                      items:
                        type: string
                      description: "Failure reasons for data source operations"
              failureReasons:
                type: array
                items:
                  type: string
                description: "Failure reasons for knowledge base operations"
                
              # Generic resource identifiers
              resourceId:
                type: string
                description: "AWS resource ID"
              resourceArn:
                type: string
                description: "AWS resource ARN"
                
              observedGeneration:
                type: integer
                description: "Generation of the spec that was last processed"
                
              lastSyncTime:
                type: string
                format: date-time
                description: "Last time the resource was synchronized with AWS"
                
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.type
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Resource ID
      type: string
      jsonPath: .status.resourceId
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
      
  scope: Namespaced
  names:
    plural: bedrockresources
    singular: bedrockresource
    kind: BedrockResource
    shortNames:
    - br
    - bedrock
